# SonarCloud project configuration
# This file configures how SonarCloud analyzes the Zopio monorepo

# Required: Organization and project keys (update with your actual values)
sonar.organization=zopiolabs
sonar.projectKey=zopiolabs_zopio_test_fork

# Project metadata
sonar.projectName=zopio_test_fork
sonar.projectVersion=0.9.0

# Source code configuration
sonar.sources=apps,packages,registry,devapps,websites
sonar.tests=apps/api/__tests__,apps/app/__tests__

# Language-specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusions - files and folders to ignore during analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.next/**,\
  **/coverage/**,\
  **/storybook-static/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.stories.tsx,\
  **/generated/**,\
  packages/database/generated/**,\
  packages/design-system/ui/**,\
  devapps/emailstudio/.react-email/**

# Test file inclusions
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Coverage exclusions - files to exclude from coverage reports
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.stories.tsx,\
  **/node_modules/**,\
  **/scripts/**,\
  **/turbo/**

# Duplication detection
sonar.cpd.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# TypeScript/JavaScript specific settings
sonar.javascript.node.maxspace=4096
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Issue assignment
sonar.issue.ignore.multicriteria=e1,e2

# Ignore specific rules that conflict with Biome
# Rule e1: Ignore "Unexpected var" since we use Biome for this
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3504
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts

# Rule e2: Ignore formatting rules handled by Biome
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1438
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*

# Quality Gate Configuration
# Enable quality gate check in CI/CD
sonar.qualitygate.wait=true

# Coverage Requirements
# Minimum coverage thresholds for the entire project
sonar.coverage.minimumRatio=80
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.stories.tsx,\
  **/node_modules/**,\
  **/scripts/**,\
  **/turbo/**,\
  **/__tests__/**,\
  **/__mocks__/**,\
  **/test/**,\
  **/*.config.*,\
  **/*.d.ts

# New Code Requirements
# These apply to code changed in PRs
sonar.new_code.coverage=80

# Code Duplication Threshold
# Maximum allowed duplicated lines density (percentage)
sonar.duplicated_lines_density=3

# Maintainability, Reliability, and Security Ratings
# A = best, E = worst
sonar.maintainability.rating=A
sonar.reliability.rating=A
sonar.security.rating=A

# Monorepo Module Configuration
# Define modules for better organization and reporting
sonar.modules=apps-api,apps-app,packages-database,packages-auth,packages-core

# Apps API Module
apps-api.sonar.projectName=API Application
apps-api.sonar.projectBaseDir=apps/api
apps-api.sonar.sources=app
apps-api.sonar.tests=__tests__
apps-api.sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**

# Apps App Module (Main Dashboard)
apps-app.sonar.projectName=Dashboard Application
apps-app.sonar.projectBaseDir=apps/app
apps-app.sonar.sources=app,components,lib
apps-app.sonar.tests=__tests__
apps-app.sonar.coverage.exclusions=**/*.test.tsx,**/*.spec.tsx,**/__tests__/**

# Packages Database Module
packages-database.sonar.projectName=Database Package
packages-database.sonar.projectBaseDir=packages/database
packages-database.sonar.sources=src
packages-database.sonar.exclusions=generated/**,scripts/**

# Packages Auth Module
packages-auth.sonar.projectName=Authentication Package
packages-auth.sonar.projectBaseDir=packages/auth
packages-auth.sonar.sources=src
packages-auth.sonar.tests=__tests__

# Packages Core Module
packages-core.sonar.projectName=Core Utilities
packages-core.sonar.projectBaseDir=packages/core-utils
packages-core.sonar.sources=src
packages-core.sonar.tests=__tests__