# SonarCloud project configuration
# This file configures how SonarCloud analyzes the Zopio monorepo

# Required: Organization and project keys (update with your actual values)
sonar.organization=zopiolabs
sonar.projectKey=zopiolabs_zopio_test_fork

# Project metadata
sonar.projectName=zopio_test_fork
sonar.projectVersion=0.9.0

# Source code configuration
sonar.sources=apps,packages,registry,devapps,websites
sonar.tests=apps/api/__tests__,apps/app/__tests__

# Language-specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusions - files and folders to ignore during analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.next/**,\
  **/coverage/**,\
  **/storybook-static/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.stories.tsx,\
  **/generated/**,\
  packages/database/generated/**,\
  packages/design-system/ui/**,\
  devapps/emailstudio/.react-email/**

# Test file inclusions
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Coverage exclusions - files to exclude from coverage reports
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.stories.tsx,\
  **/node_modules/**,\
  **/scripts/**,\
  **/turbo/**

# Duplication detection
sonar.cpd.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# TypeScript/JavaScript specific settings
sonar.javascript.node.maxspace=4096
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Issue assignment
sonar.issue.ignore.multicriteria=e1,e2

# Ignore specific rules that conflict with Biome
# Rule e1: Ignore "Unexpected var" since we use Biome for this
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3504
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts

# Rule e2: Ignore formatting rules handled by Biome
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1438
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*